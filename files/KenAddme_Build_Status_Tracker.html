<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KenAddme IT Links — Project Build Status Tracker</title>
<style>
/* ---------------------------------------------------------------- tokens --
   Cool slate paper with an approval-green seal colour. The palette is meant to
   read like a controlled institutional record, not a dashboard product.       */
:root{
  --ground:#E9EDEC;      /* page background          */
  --panel:#FFFFFF;       /* cards and ledger rows    */
  --ink:#16262E;         /* primary text             */
  --muted:#5D7078;       /* secondary text           */
  --rule:#C6D2D0;        /* hairlines and borders    */
  --tint:#DCE6E3;        /* quiet fills              */
  --seal:#14634E;        /* complete / approved      */
  --hold:#9A6410;        /* in progress / conditions */
  --stop:#96302B;        /* blocked / terminate      */
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;
}
a{color:var(--seal)}
button,select,input,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ------------------------------------------------------------- structure -- */
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px}
header.masthead{
  border-bottom:2px solid var(--ink);
  padding:26px 0 16px;margin-bottom:20px;
}
.masthead h1{
  font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;
  margin:0 0 6px;letter-spacing:-.01em;
}
.masthead p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{
  background:var(--panel);border:1px solid var(--rule);border-radius:2px;
  padding:7px 13px;cursor:pointer;color:var(--ink);
}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#0d1a20}

/* tabs across the top of the working area */
nav.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--rule)}
nav.tabs button{
  background:none;border:0;border-bottom:3px solid transparent;
  padding:10px 14px;cursor:pointer;color:var(--muted);
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--seal);font-weight:600}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:18px;margin-bottom:16px}
.panel h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 4px}
.panel h3{font-size:14px;margin:18px 0 8px;font-weight:600}
.note{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:78ch}

/* -------------------------------------------------------------- the spine --
   The gate list is the memorable element: a vertical rule the project moves
   down, with a fill bar showing how much required evidence exists.            */
.ledger{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.ledger{grid-template-columns:1fr}}

.spine{border-left:2px solid var(--rule);padding-left:0}
.gate-btn{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-left:3px solid transparent;margin-left:-2px;
  padding:11px 12px;cursor:pointer;
}
.gate-btn:hover{background:var(--tint)}
.gate-btn[aria-current="true"]{border-left-color:var(--seal);background:var(--tint)}
.gate-btn .gid{font-family:var(--serif);font-size:17px}
.gate-btn .gname{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.bar{height:4px;background:var(--rule);margin-top:8px;position:relative;border-radius:2px;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--seal);width:0}
.gate-btn .count{float:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------ item rows -- */
.stage-head{border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:14px}
.stage-head h2{margin-bottom:2px}
.meta{font-size:13px;color:var(--muted);margin:2px 0}
.exit{background:var(--tint);border-left:3px solid var(--seal);padding:10px 12px;font-size:13.5px;margin:12px 0 18px}

.item{border:1px solid var(--rule);border-radius:2px;padding:12px;margin-bottom:10px}
.item.done{border-left:3px solid var(--seal)}
.item.prog{border-left:3px solid var(--hold)}
.item.na{opacity:.62}
.item .txt{display:flex;gap:10px;align-items:flex-start}
.item .ref{font-family:var(--serif);font-size:13px;color:var(--muted);white-space:nowrap;padding-top:1px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.fields label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.fields input,.fields select,.fields textarea{
  width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:2px;background:#fff;
}
.fields textarea{min-height:38px;resize:vertical}
.wide{grid-column:1/-1}

/* --------------------------------------------------------- gate decision -- */
.decision{border:1px solid var(--ink);border-radius:2px;padding:14px;margin-top:20px}
.decision h3{margin-top:0}
.badge{display:inline-block;padding:2px 9px;border-radius:2px;font-size:12px;border:1px solid var(--rule)}
.badge.ok{background:var(--seal);color:#fff;border-color:var(--seal)}
.badge.warn{background:var(--hold);color:#fff;border-color:var(--hold)}
.badge.bad{background:var(--stop);color:#fff;border-color:var(--stop)}

/* ------------------------------------------------------------ data tables -- */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--rule);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--ink);color:#fff;font-weight:600;font-size:12px}
tbody tr:nth-child(even){background:#F6F8F7}
td input,td textarea{width:100%;min-width:130px;border:1px solid transparent;background:transparent;padding:4px}
td input:focus,td textarea:focus{background:#fff;border-color:var(--rule)}
.example td{color:var(--muted);font-style:italic;background:var(--tint)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{border:1px solid var(--rule);padding:12px;background:var(--panel)}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:400;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

.hidden{display:none}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--rule);padding-top:14px;margin-top:26px}
@media print{
  .toolbar,nav.tabs,.spine{display:none}
  body{background:#fff}
  .panel{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <h1>Project build status tracker</h1>
  <p id="subtitle"></p>
  <div class="toolbar">
    <button class="btn primary" id="btn-save">Save now</button>
    <button class="btn" id="btn-export">Download a copy of the data</button>
    <button class="btn" id="btn-import">Load saved data</button>
    <button class="btn" id="btn-print">Print or save as PDF</button>
    <button class="btn" id="btn-reset">Clear everything</button>
    <input type="file" id="file-input" accept="application/json" class="hidden">
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="view"></main>

<footer>
  <div id="sources"></div>
  <div id="saved-note" style="margin-top:6px"></div>
</footer>
</div>

/* =========================================================================
   Storage. Three fallbacks so the file works inside the app, in a browser,
   and from a plain local copy with storage disabled.
   ========================================================================= */
const KEY = "kenaddme-build-tracker-v1";
let memoryOnly = false;

const Store = {
  async get(){
    try{ if(window.storage){ const r = await window.storage.get(KEY,false); return r ? r.value : null; } }catch(e){}
    try{ return localStorage.getItem(KEY); }catch(e){ memoryOnly = true; return null; }
  },
  async set(value){
    try{ if(window.storage){ await window.storage.set(KEY,value,false); return true; } }catch(e){}
    try{ localStorage.setItem(KEY,value); return true; }catch(e){ memoryOnly = true; return false; }
  }
};

/* =========================================================================
   State. Everything the user types lives here and is keyed so that adding
   items to DATA later never scrambles existing entries.
   ========================================================================= */
let state = {
  project: {},    // field name -> value
  items:   {},    // "PM|Gate 1.01" -> {status, owner, due, done, ref, notes}
  gates:   {},    // "PM|Gate 1"    -> {decision, date, authority, conditions}
apiItems:{},    // "PM|Gate 1.01" -> API evidence item id
  measures:{},    // index          -> {value, date}
  registers:{}    // "risk"         -> array of row objects
};

const API_BASE = window.location.protocol === "http:" || window.location.protocol === "https:"
  ? window.location.origin
  : null;
let apiProjectId = null;

async function syncFromApi(){
  if(!API_BASE) return false;
  try{
    const projectsResponse = await fetch(API_BASE + "/tracker/projects");
    if(!projectsResponse.ok) return false;
    const projects = await projectsResponse.json();
    if(!projects.length) return false;

    const project = projects[0];
    apiProjectId = project.id;
    const statusResponse = await fetch(API_BASE + "/tracker/projects/" + project.id + "/status");
    if(!statusResponse.ok) return false;
    const status = await statusResponse.json();
    state.items = {};
    state.gates = {};
    state.apiItems = {};

    const fields = {
      "Project / product name": project.name,
      "Project register ID": project.register_id || "",
      "Project class (PM)": project.pm_class,
      "Software class (SDLC)": project.sdlc_class,
      "Classification rationale": project.classification_note || "",
      "Project Sponsor": project.sponsor || "",
      "Project Manager / Delivery Lead": project.project_manager || "",
      "Technical Lead / Solution Architect": project.technical_lead || "",
      "Service / Operations Owner": project.service_owner || "",
      "Release Authority": project.release_authority || ""
    };
    state.project = Object.assign({}, state.project, fields);

    for(const track of DATA.tracks){
      const itemsResponse = await fetch(
        API_BASE + "/tracker/projects/" + project.id + "/items?track=" + encodeURIComponent(track.id)
      );
      if(!itemsResponse.ok) continue;
      const items = await itemsResponse.json();
      for(const item of items){
        const key = item.track + "|" + item.reference;
        state.items[key] = {
          status: item.item_status,
          owner: item.owner || "",
          due: item.due_date || "",
          done: item.completed_date || "",
          ref: item.evidence_reference || "",
          notes: item.notes || ""
        };
        state.apiItems[key] = item.id;
      }
    }
    for(const gate of status.gates){
      state.gates[gateKey(gate.track, gate.gate)] = {
        decision: gate.decision,
        date: gate.decision_date || "",
        authority: gate.authority || "",
        conditions: gate.conditions || ""
      };
    }
    return true;
  }catch(e){
    return false;
  }
}

async function updateApiItem(itemId, record){
  if(!API_BASE || !itemId) return;
  const response = await fetch(API_BASE + "/tracker/items/" + itemId, {
    method: "PATCH",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      item_status: record.status,
      owner: record.owner || null,
      due_date: record.due || null,
      completed_date: record.done || null,
      evidence_reference: record.ref || null,
      notes: record.notes || null
    })
  });
  if(!response.ok) throw new Error("Evidence item update failed");
}

async function updateApiGate(track, gate, record){
  if(!API_BASE || !apiProjectId) return;
  const response = await fetch(
    API_BASE + "/tracker/projects/" + apiProjectId + "/gates/" +
      encodeURIComponent(track) + "/" + encodeURIComponent(gate),
    {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        decision: record.decision,
        decision_date: record.date || null,
        authority: record.authority || null,
        conditions: record.conditions || null
      })
    }
  );
  if(!response.ok) throw new Error("Gate decision update failed");
}

function apiUpdate(task){
  if(!API_BASE) return;
  task().catch(error => {
    const note = document.getElementById("saved-note");
    note.textContent = "Local change saved, but API update failed: " + error.message;
  });
}

function itemKey(track, gate, n){ return track + "|" + gate + "." + String(n).padStart(2,"0"); }
function gateKey(track, gate){ return track + "|" + gate; }

function getItem(key){
  if(!state.items[key]) state.items[key] = {status:"Not started", owner:"", due:"", done:"", ref:"", notes:""};
  return state.items[key];
}
function getGate(key){
  if(!state.gates[key]) state.gates[key] = {decision:"Not yet held", date:"", authority:"", conditions:""};
  return state.gates[key];
}

/* Debounced save so typing does not hit storage on every keystroke. */
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
}
async function save(){
  const ok = await Store.set(JSON.stringify(state));
  const note = document.getElementById("saved-note");
  const stamp = new Date().toLocaleTimeString();
  note.textContent = ok
    ? "Saved at " + stamp + "."
    : "Storage is unavailable here, so entries last only until this page closes. Use \u201cDownload a copy of the data\u201d to keep them.";
}

/* =========================================================================
   Progress helpers. An item counted as tailored out is removed from the
   denominator, matching how the Appendix A floor is applied.
   ========================================================================= */
const TAILORED = ["Not applicable","Exception approved"];

function gateProgress(track, stage){
  let total = stage.items.length, done = 0, tailored = 0, prog = 0;
  stage.items.forEach((_, i) => {
    const s = getItem(itemKey(track, stage.gate, i+1)).status;
    if(s === "Complete") done++;
    else if(TAILORED.includes(s)) tailored++;
    else if(s === "In progress" || s === "Submitted for review") prog++;
  });
  const denom = total - tailored;
  return {total, done, tailored, prog, denom,
          outstanding: denom - done,
          pct: denom ? done/denom : 1};
}

function trackProgress(track){
  let t=0,d=0,ta=0;
  track.stages.forEach(s => { const p = gateProgress(track.id, s); t+=p.total; d+=p.done; ta+=p.tailored; });
  return {total:t, done:d, tailored:ta, denom:t-ta, pct:(t-ta)?d/(t-ta):1};
}

/* =========================================================================
   Small DOM helpers, kept deliberately plain.
   ========================================================================= */
function el(tag, attrs, children){
  const node = document.createElement(tag);
  for(const k in (attrs||{})){
    if(k === "class") node.className = attrs[k];
    else if(k === "html") node.innerHTML = attrs[k];
    else if(k === "text") node.textContent = attrs[k];
    else if(k.startsWith("on")) node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => node.appendChild(c));
  return node;
}
function field(labelText, control, wide){
  const box = el("div", {class: wide ? "wide" : ""});
  box.appendChild(el("label", {text: labelText}));
  box.appendChild(control);
  return box;
}
function input(type, value, onchange, placeholder){
  const i = el("input", {type: type, value: value || ""});
  if(placeholder) i.placeholder = placeholder;
  i.addEventListener("input", e => { onchange(e.target.value); scheduleSave(); });
  return i;
}
function textarea(value, onchange, placeholder){
  const t = el("textarea", {});
  t.value = value || "";
  if(placeholder) t.placeholder = placeholder;
  t.addEventListener("input", e => { onchange(e.target.value); scheduleSave(); });
  return t;
}
function select(options, value, onchange){
  const s = el("select", {});
  options.forEach(o => {
    const opt = el("option", {value:o, text:o});
    if(o === value) opt.selected = true;
    s.appendChild(opt);
  });
  s.addEventListener("change", e => { onchange(e.target.value); scheduleSave(); });
  return s;
}

function renderTrack(trackId){
  const track = DATA.tracks.find(t => t.id === trackId);
  const view = document.getElementById("view");
  const tp = trackProgress(track);

  const stats = el("div", {class:"summary"});
  [[tp.done + " of " + tp.denom, "Evidence items recorded"],
   [Math.round(tp.pct*100) + "%", "Required evidence complete"],
   [tp.tailored, "Tailored out or under exception"],
   [track.stages.filter(s => getGate(gateKey(trackId, s.gate)).decision === "Approve" ||
                             getGate(gateKey(trackId, s.gate)).decision === "Approve with conditions").length
      + " of " + track.stages.length, "Gates decided"]
  ].forEach(([big, small]) => {
    stats.appendChild(el("div", {class:"stat"}, [el("b",{text:String(big)}), el("span",{text:small})]));
  });

  /* left: the spine */
  const spine = el("div", {class:"spine"});
  track.stages.forEach((stage, idx) => {
    const p = gateProgress(trackId, stage);
    const btn = el("button", {class:"gate-btn", onclick:() => { currentGate[trackId] = idx; render(); }});
    btn.setAttribute("aria-current", currentGate[trackId] === idx);
    btn.appendChild(el("span", {class:"count", text: p.done + "/" + p.denom}));
    btn.appendChild(el("span", {class:"gid", text: stage.gate}));
    btn.appendChild(el("span", {class:"gname", text: stage.gate_name}));
    const bar = el("div", {class:"bar"});
    const fill = el("span", {});
    fill.style.width = Math.round(p.pct*100) + "%";
    if(p.outstanding > 0) fill.style.background = "var(--hold)";
    bar.appendChild(fill);
    btn.appendChild(bar);
    spine.appendChild(btn);
  });

  /* right: the evidence ledger for the selected gate */
  const stage = track.stages[currentGate[trackId]];
  const p = gateProgress(trackId, stage);
  const right = el("div", {});

  const head = el("div", {class:"stage-head"});
  head.appendChild(el("h2", {text: stage.gate + " — " + stage.gate_name}));
  head.appendChild(el("p", {class:"meta", text: stage.stage}));
  head.appendChild(el("p", {class:"meta", text: "Decision: " + stage.decision}));
  head.appendChild(el("p", {class:"meta", text: "Decision owner: " + stage.approver}));
  right.appendChild(head);
  right.appendChild(el("div", {class:"exit", text: "Exit criteria. " + stage.exit}));

  right.appendChild(el("p", {class:"note", text:
    p.outstanding > 0
      ? p.outstanding + " of " + p.denom + " required evidence items are still outstanding at this gate."
      : "All required evidence at this gate is recorded. The named authority can now decide."}));

  stage.items.forEach((text, i) => {
    const key = itemKey(trackId, stage.gate, i+1);
    const rec = getItem(key);
    let cls = "item";
    if(rec.status === "Complete") cls += " done";
    else if(rec.status === "In progress" || rec.status === "Submitted for review") cls += " prog";
    else if(TAILORED.includes(rec.status)) cls += " na";

    const row = el("div", {class:cls});
    row.appendChild(el("div", {class:"txt"}, [
      el("span", {class:"ref", text: stage.gate + "." + String(i+1).padStart(2,"0")}),
      el("span", {text: text})
    ]));

    const f = el("div", {class:"fields"});
    const apiItem = state.apiItems && state.apiItems[key];
    const persistItem = () => apiUpdate(() => updateApiItem(apiItem, rec));
    f.appendChild(field("Status", select(DATA.meta.statuses, rec.status, v => { rec.status = v; persistItem(); render(); })));
    f.appendChild(field("Owner", input("text", rec.owner, v => { rec.owner = v; persistItem(); }, "Named person")));
    f.appendChild(field("Due", input("date", rec.due, v => { rec.due = v; persistItem(); })));
    f.appendChild(field("Completed", input("date", rec.done, v => { rec.done = v; persistItem(); })));
    f.appendChild(field("Evidence reference", input("text", rec.ref, v => { rec.ref = v; persistItem(); }, "Where the record lives"), true));
    f.appendChild(field("Notes", textarea(rec.notes, v => { rec.notes = v; persistItem(); }, "Conditions, deviations, links"), true));
    row.appendChild(f);
    right.appendChild(row);
  });

  /* gate decision block */
  const gk = gateKey(trackId, stage.gate);
  const g = getGate(gk);
  const dec = el("div", {class:"decision"});
  dec.appendChild(el("h3", {text:"Gate decision"}));
  let badgeClass = "badge";
  if(g.decision === "Approve") badgeClass += " ok";
  else if(g.decision === "Approve with conditions" || g.decision === "Hold" || g.decision === "Redirect") badgeClass += " warn";
  else if(g.decision === "Terminate") badgeClass += " bad";
  dec.appendChild(el("p", {}, [el("span", {class:badgeClass, text:g.decision})]));
  const df = el("div", {class:"fields"});
  const persistGate = () => apiUpdate(() => updateApiGate(trackId, stage.gate, g));
  df.appendChild(field("Decision", select(DATA.meta.gate_decisions, g.decision, v => { g.decision = v; persistGate(); render(); })));
  df.appendChild(field("Decision date", input("date", g.date, v => { g.date = v; persistGate(); })));
  df.appendChild(field("Deciding authority", input("text", g.authority, v => { g.authority = v; persistGate(); }, "Name and role")));
  df.appendChild(field("Conditions, owners and due dates", textarea(g.conditions, v => { g.conditions = v; persistGate(); },
    "Unresolved critical conditions cannot be approved with conditions"), true));
  dec.appendChild(df);
  right.appendChild(dec);

  view.innerHTML = "";
  const panel = el("div", {class:"panel"});
  panel.appendChild(el("h2", {text: track.name}));
  panel.appendChild(el("p", {class:"note", text: "Source: " + track.source}));
  panel.appendChild(stats);
  panel.appendChild(el("div", {class:"ledger"}, [spine, right]));
  view.appendChild(panel);
}

/* ---- project details ---- */
function renderSetup(){
  const view = document.getElementById("view");
  const panel = el("div", {class:"panel"});
  panel.appendChild(el("h2", {text:"Project details"}));
  panel.appendChild(el("p", {class:"note", text:
    "The controlled header for both tracks. Classification decides how deep the evidence must go, "
    + "so set it before you start ticking items."}));

  const grid = el("div", {class:"fields"});
  DATA.project_fields.forEach(f => {
    const control = f.hint && f.hint.length > 60
      ? textarea(state.project[f.field], v => state.project[f.field] = v, f.hint)
      : input("text", state.project[f.field], v => state.project[f.field] = v, f.hint);
    grid.appendChild(field(f.field, control, true));
  });
  panel.appendChild(grid);
  view.innerHTML = "";
  view.appendChild(panel);
}

/* ---- registers ---- */
const REGISTERS = [
  ["risk","Risk and issue register"],
  ["change","Change requests"],
  ["exception","Exceptions and non-conformances"],
  ["emergency","Emergency changes"],
  ["decision","Gate and decision log"]
];

function renderRegisters(){
  const view = document.getElementById("view");
  view.innerHTML = "";
  REGISTERS.forEach(([key, title]) => {
    const reg = DATA.registers[key];
    if(!state.registers[key]) state.registers[key] = [];
    const rows = state.registers[key];

    const panel = el("div", {class:"panel"});
    panel.appendChild(el("h2", {text:title}));
    panel.appendChild(el("p", {class:"note", text: reg.note}));

    const table = el("table", {});
    const thead = el("thead", {});
    const hr = el("tr", {});
    reg.columns.forEach(c => hr.appendChild(el("th", {text:c})));
    hr.appendChild(el("th", {text:""}));
    thead.appendChild(hr);
    table.appendChild(thead);

    const tbody = el("tbody", {});
    const ex = el("tr", {class:"example"});
    reg.example.forEach(v => ex.appendChild(el("td", {text:String(v)})));
    ex.appendChild(el("td", {text:"example"}));
    tbody.appendChild(ex);

    rows.forEach((row, ri) => {
      const tr = el("tr", {});
      reg.columns.forEach((c, ci) => {
        const td = el("td", {});
        td.appendChild(input("text", row[ci] || "", v => row[ci] = v));
        tr.appendChild(td);
      });
      const del = el("td", {});
      del.appendChild(el("button", {class:"btn", text:"Remove",
        onclick:() => { rows.splice(ri,1); save(); render(); }}));
      tr.appendChild(del);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    panel.appendChild(el("div", {class:"scroll"}, [table]));
    panel.appendChild(el("button", {class:"btn primary", text:"Add an entry",
      onclick:() => { rows.push(reg.columns.map(() => "")); save(); render(); }}));
    view.appendChild(panel);
  });
}

/* ---- measures ---- */
function renderMeasures(){
  const view = document.getElementById("view");
  const panel = el("div", {class:"panel"});
  panel.appendChild(el("h2", {text:"Year-One mandatory measures"}));
  panel.appendChild(el("p", {class:"note", text:
    "Both frameworks make five measures mandatory from the effective date of 31 October 2026."}));

  const table = el("table", {});
  const thead = el("thead", {});
  const hr = el("tr", {});
  ["Track","Measure","Source and owner","Frequency","Target","Current value","As at"].forEach(c => hr.appendChild(el("th",{text:c})));
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el("tbody", {});
  DATA.measures.forEach((m, i) => {
    if(!state.measures[i]) state.measures[i] = {value:"", date:""};
    const rec = state.measures[i];
    const tr = el("tr", {});
    [m.track, m.measure, m.source_owner, m.frequency, m.target].forEach(v => tr.appendChild(el("td",{text:v})));
    const v1 = el("td", {}); v1.appendChild(input("text", rec.value, v => rec.value = v)); tr.appendChild(v1);
    const v2 = el("td", {}); v2.appendChild(input("date", rec.date, v => rec.date = v)); tr.appendChild(v2);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  panel.appendChild(el("div", {class:"scroll"}, [table]));
  view.innerHTML = ""; view.appendChild(panel);
}

/* ---- reference tables ---- */
function simpleTable(headers, rows){
  const table = el("table", {});
  const thead = el("thead", {}); const hr = el("tr", {});
  headers.forEach(h => hr.appendChild(el("th",{text:h})));
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el("tbody", {});
  rows.forEach(r => {
    const tr = el("tr", {});
    r.forEach(c => tr.appendChild(el("td",{text:c})));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return el("div", {class:"scroll"}, [table]);
}

function renderReference(){
  const view = document.getElementById("view");
  view.innerHTML = "";

  const p1 = el("div", {class:"panel"});
  p1.appendChild(el("h2", {text:"Mandatory artefact floor by software class"}));
  p1.appendChild(el("p", {class:"note", text:
    "R = required, C = conditional as stated, N/A = not applicable. Records may be combined; a required "
    + "record may not be omitted without an approved exception."}));
  p1.appendChild(simpleTable(
    ["Stage","Class 1","Class 2","Class 3","Class 4","Tailoring floor","Owner","Approval / evidence"],
    DATA.artefact_floor.map(a => [a.stage,a.c1,a.c2,a.c3,a.c4,a.floor,a.owner,a.evidence])));
  view.appendChild(p1);

  const p2 = el("div", {class:"panel"});
  p2.appendChild(el("h2", {text:"Gate alignment and evidence reuse"}));
  p2.appendChild(el("p", {class:"note", text:
    "Evidence is created once and referenced by both tracks. The higher classification, stronger control "
    + "and more senior approver govern wherever the mappings differ."}));
  p2.appendChild(simpleTable(["Project gate","Software checkpoint","Consolidation rule"],
    DATA.alignment.map(a => [a.pm,a.sdlc,a.rule])));
  view.appendChild(p2);

  const p3 = el("div", {class:"panel"});
  p3.appendChild(el("h2", {text:"Classification mapping"}));
  p3.appendChild(simpleTable(["Project class","Normal software class","Mandatory interpretation"],
    DATA.class_mapping.map(c => [c.pm_class,c.sdlc_class,c.interpretation])));
  view.appendChild(p3);
}

/* ---- router ---- */
function render(){
  renderTabs();
  if(currentTab === "PM" || currentTab === "SDLC") renderTrack(currentTab);
  else if(currentTab === "setup") renderSetup();
  else if(currentTab === "registers") renderRegisters();
  else if(currentTab === "measures") renderMeasures();
  else renderReference();
  scheduleSave();
}

/* =========================================================================
   Toolbar actions.
   ========================================================================= */
document.getElementById("btn-save").addEventListener("click", save);

document.getElementById("btn-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const a = el("a", {href:URL.createObjectURL(blob), download:"kenaddme-build-status.json"});
  document.body.appendChild(a); a.click(); a.remove();
});

document.getElementById("btn-import").addEventListener("click", () => document.getElementById("file-input").click());
document.getElementById("file-input").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      state = JSON.parse(reader.result);
      save(); render();
    }catch(err){
      alert("That file is not a tracker export. Choose the JSON file downloaded from this tracker.");
    }
  };
  reader.readAsText(file);
});

document.getElementById("btn-print").addEventListener("click", () => window.print());

document.getElementById("btn-reset").addEventListener("click", () => {
  if(confirm("Clear every entry in this tracker? Download a copy first if you need one.")){
    state = {project:{}, items:{}, gates:{}, apiItems:{}, measures:{}, registers:{}};
    save(); render();
  }
});

/* =========================================================================
   Start.
   ========================================================================= */
(async function start(){
  document.getElementById("view").innerHTML =
    '<div class="panel"><h2>Loading project workspace</h2><p class="note">Connecting to the tracker API and loading registered projects...</p></div>';
  document.getElementById("subtitle").textContent = DATA.meta.subtitle;
  document.getElementById("sources").innerHTML =
    DATA.meta.sources.map(s => "<div>" + s + "</div>").join("")
    + "<div>Framework owner and custodian: " + DATA.meta.owner + "</div>";
  const saved = await Store.get();
  if(saved){
    try{ state = JSON.parse(saved); }catch(e){}
  }
  const synced = await syncFromApi();
  if(synced){
    document.getElementById("saved-note").textContent =
      "Loaded from the tracker API. Project " + state.project["Project / product name"] + ".";
  }
  render();
  if(memoryOnly){
    document.getElementById("saved-note").textContent =
      "Storage is unavailable here, so entries last only until this page closes. Use \u201cDownload a copy of the data\u201d to keep them.";
  }
})();
</script>
