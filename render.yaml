# Render Blueprint (Infrastructure as Code) -- DRAFT, UNVALIDATED.
#
# No Render account exists yet, so this has never actually been deployed.
# See files/Hosting_Decision_Finance_Management_Platform.md for the
# rationale and a known pre-deploy gotcha (DATABASE_URL driver scheme).
# Review against Render's current Blueprint YAML Reference before first use.

databases:
  - name: finance-db
    databaseName: finance
    user: finance_app
    plan: basic-256mb

services:
  - type: web
    name: finance-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL below is Render's bare `postgres://` connection string.
      # Per the Hosting Decision doc section 4, this MUST be manually edited
      # in the Render dashboard to `postgresql+psycopg://` after first
      # provisioning -- SQLAlchemy will not connect with the unmodified
      # scheme, since this project uses psycopg3, not psycopg2.
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false

  - type: web
    name: finance-consumer
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: finance-admin
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /admin.html
